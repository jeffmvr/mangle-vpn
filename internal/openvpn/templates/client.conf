{{- if .ProfileName }}
# OVPN_ACCESS_SERVER_PROFILE={{ .ProfileName }}
{{- end }}
{{- if .FriendlyName }}
# OVPN_ACCESS_SERVER_FRIENDLY_NAME={{ .FriendlyName }}
{{- end }}
client
verb 3
dev tun
persist-tun
persist-key
{{- if .IdleTimeout }}
inactive {{ .IdleTimeout }}
{{- end }}
ping-timer-rem
remote {{ .Hostname }} {{ .Port }} {{ .Protocol }}
{{ if and .MSSFix (eq .Protocol "udp") }}
mssfix {{ .MSSFix }}
{{ end }}
remote-cert-tls server
resolv-retry infinite
nobind
tls-version-min 1.2
auth SHA512
auth-nocache
auth-user-pass
{{- if .StaticChallenge }}
static-challenge "{{ .StaticChallenge }}" 1
{{- end }}
verify-x509-name "OpenVPN Server" name
key-direction 1
{{ if eq .Protocol "udp" }}
explicit-exit-notify
{{ end }}
{{- if eq .OS "windows" }}
block-outside-dns
{{- end }}

<ca>
{{ .CACertificate }}
</ca>
<cert>
{{ .Certificate }}
</cert>
<key>
{{ .PrivateKey }}
</key>
<tls-auth>
{{ .TLSAuthKey }}
</tls-auth>
